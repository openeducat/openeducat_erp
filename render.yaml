services:
  - type: web
    name: truelearners-openeducat
    runtime: docker
    # This paid plan provides 2 CPUs and 4 GB RAM; review the current price before creating it.
    # Do not deploy until the account owner has reviewed the current price.
    plan: 2c-4g
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /web/login
    envVars:
      # Supabase Session Pooler connection. Use the pooler host and username
      # shown by Supabase; do not use transaction pooling for Odoo.
      - key: HOST
        sync: false
      - key: USER
        sync: false
      - key: PASSWORD
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGSSLMODE
        value: require
      - key: DB_NAME
        value: postgres
      - key: RUNNING_ENV
        value: prod

      # Backblaze B2 S3-compatible endpoint and bucket credentials.
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
